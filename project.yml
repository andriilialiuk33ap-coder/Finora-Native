name: Finora
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '3.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  Finora:
    type: application
    platform: iOS
    sources: [Finora]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.finora.personal
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Finora
        INFOPLIST_KEY_NSFaceIDUsageDescription: 'Захист особистих фінансів'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
