name: Finora
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '6.4.19'
    CURRENT_PROJECT_VERSION: '67'
    TARGETED_DEVICE_FAMILY: '1'
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.19
targets:
  Finora:
    type: application
    platform: iOS
    sources: [Finora, WidgetShared]
    info:
      path: Config/Finora-Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        BGTaskSchedulerPermittedIdentifiers: [ua.finora.personal.capture-refresh]
        UIBackgroundModes: [fetch]
        CFBundleURLTypes:
          - CFBundleURLName: ua.finora.personal.widgets
            CFBundleURLSchemes: [finami-widget]
    dependencies:
      - package: ZIPFoundation
      - target: FinamiWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.finora.personal
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Finami
        INFOPLIST_KEY_NSFaceIDUsageDescription: 'Захист особистих фінансів'
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Запис голосової чернетки витрати"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Розпізнавання голосової чернетки операції"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  FinamiWidgets:
    type: app-extension
    platform: iOS
    sources: [FinamiWidgets, WidgetShared]
    info:
      path: Config/FinamiWidgets-Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: Finami Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.finora.personal.widgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  FinamiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Finora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.finora.personal.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Finora
schemes:
  Finora:
    build:
      targets:
        Finora: all
        FinamiUITests: [test]
    test:
      config: Debug
      targets:
        - FinamiUITests
